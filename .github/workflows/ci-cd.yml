name: bbl-ci-cd

on:
  push:
    branches:
      - master
      - develop
  pull_request:

# node 버전은 .nvmrc, pnpm 버전은 package.json 의 packageManager 가 단일 출처다.
# 여기에 버전을 다시 적지 않는다.

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm eslint

      - run: pnpm test

      - run: pnpm build

  production-deployment:
    if: ${{ github.ref == 'refs/heads/master' }}
    name: Vercel Deployment
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Deploy Project Artifacts to Vercel
        run: npx vercel --yes --token=${{ secrets.VERCEL_TOKEN }}

  storybook-deploy:
    if: ${{ github.ref == 'refs/heads/develop' }}
    name: Storybook Deployment
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Storybook Build
        run: pnpm build-storybook:github

      # 빌드 성공(exit 0)이 산출물 존재를 뜻하지 않는다. 프리뷰 컴파일이 죽어도
      # 매니저만 만들어진 채 exit 0 으로 끝날 수 있으므로 iframe.html 을 직접 확인한다.
      - name: Assert storybook output
        run: |
          test -f dist/storybook/ui-components/iframe.html
          test -f dist/storybook/features/iframe.html

      - name: Publish to Storybook
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/storybook/

  chromatic-deployment:
    name: Chromatic Deployment
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Storybook Build
        run: pnpm ui-components:build-storybook

      - name: Assert storybook output
        run: test -f dist/storybook/ui-components/iframe.html

      - name: Publish to Chromatic
        uses: chromaui/action@v1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: dist/storybook/ui-components
